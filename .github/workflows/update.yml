name: Update MTProto DC Config

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: actions-rust-lang/setup-rust-toolchain@v1

      - name: Generate MTProto config
        run: |
          cd MTProtoDCConfigGenerator
          cargo run --release -- ../mtproto-dc-config.json

      - name: Commit changes
        run: |
          git config --global user.name "github-actions"
          git config --global user.email "actions@github.com"

          git add mtproto-dc-config.json

          git commit -m "Update MTProto DC config" || exit 0

          git push
name: Update MTProto Config

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Rust
        uses: actions-rust-lang/setup-rust-toolchain@v1

      - name: Generate
        run: |
          cargo run --release -- mtproto-dc-config.json

      - name: Commit
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com

          git add mtproto-dc-config.json

          git commit -m "update mtproto config" || exit 0

          git push